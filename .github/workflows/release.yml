name: release

# Publishes PyPI `code-guardian-mcp` when a GitHub Release is published, by trusted publishing: PyPI
# trusts this workflow file in this repository and hands the publishing job a short-lived OIDC
# credential, and the upload carries signed provenance pointing at the commit. No stored registry
# credential exists anywhere. Steps for the owner: docs/RELEASING.md.
#
# pull_request and workflow_dispatch with dry_run (the default) run the same tag check, build and
# check steps and stop before anything is published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; publish nothing"
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to a commit SHA, not a tag: a tag is mutable, and a moved
# `v4` would run code nobody reviewed with this repo's token. The comment names the release.
jobs:
  # Build and check in a job that holds no OIDC permission; the publishing job below only uploads
  # what was built and checked here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # The tag must be "v" + pyproject.toml's version, as written there. It is checked for a published
      # release, and for a manual run that will publish (a v* tag with dry_run unticked); a pull request
      # or a dry run has no tag to check.
      - name: Check tag against pyproject.toml
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          event = os.environ["EVENT"]
          if event == "release":
              tag = os.environ["RELEASE_TAG"]
          elif event == "workflow_dispatch" and os.environ["DRY_RUN"] != "true":
              if os.environ["REF_TYPE"] != "tag":
                  sys.exit("a manual run that publishes must be started on a v* tag, not a branch")
              tag = os.environ["REF_NAME"]
          else:
              print("dry run: nothing to check against a tag")
              sys.exit(0)
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if tag != "v" + version:
              sys.exit("tag %s does not equal v%s (pyproject.toml's version)" % (tag, version))
          print("tag %s matches pyproject.toml version %s" % (tag, version))
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    # Only a published release, or a manual run with dry_run unticked, publishes.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/code-guardian-mcp/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
