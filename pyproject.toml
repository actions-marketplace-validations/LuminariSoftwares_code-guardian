[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# "code-guardian" on PyPI belongs to another project; the commands are still code-guardian and code-guardian-mcp.
name = "code-guardian-mcp"
version = "0.3.4"
description = "Is this codebase safe to run, will it work, and is it complete? Deterministic Safe, Works and Complete scores with an A-F grade, from static analysis only, plus a verify loop for AI-assisted changes: baseline, repair plan, before/after diff. The code is never run."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LuminariSoftwares" }]
keywords = ["security", "static-analysis", "dead-code", "supply-chain", "secrets", "mcp", "local-llm", "ai-code-review", "baseline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# The test suite only; `dependencies` stays empty, so installing the tool pulls in nothing.
# build: tests/test_spdx_license.py builds a wheel and reads its METADATA.
# jsonschema: tests/test_outputs.py validates the SARIF, tests/test_tool_docs.py the MCP schemas.
# pyyaml: tests/test_support_kit.py parses the GitHub issue forms.
test = ["pytest", "build", "jsonschema", "pyyaml"]

[project.urls]
Homepage = "https://github.com/LuminariSoftwares/code-guardian"
Issues = "https://github.com/LuminariSoftwares/code-guardian/issues"
Changelog = "https://github.com/LuminariSoftwares/code-guardian/blob/main/CHANGELOG.md"

[project.scripts]
code-guardian = "code_guardian.cli:main"
code-guardian-mcp = "code_guardian.mcp_server:main"

[tool.setuptools]
packages = ["code_guardian"]

[tool.setuptools.package-data]
# the offline list of known PyPI projects; without this a wheel installs with no list; ui/ is the local page
code_guardian = ["data/*.gz", "ui/*.html", "ui/*.css", "ui/*.js"]
